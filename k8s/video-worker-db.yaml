apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-worker-db
  namespace: video-infra
  labels:
    app: video-worker-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-worker-db
  template:
    metadata:
      labels:
        app: video-worker-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "video_processing"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: video-worker-db-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: video-worker-db-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: video-worker-db-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: video-worker-db-pvc
  namespace: video-infra
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: video-worker-db
  namespace: video-infra
spec:
  selector:
    app: video-worker-db
  ports:
    - port: 5432
      targetPort: 5432
